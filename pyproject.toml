[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discode"
version = "1.0.1"
description = "Deep learning-based Iterative pipeline to analyze Specificity of COfactors and to Design Enzyme"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0.1",
    "fair-esm==2.0.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "tqdm",
    "jupyter",
]

[project.urls]
Homepage = "https://github.com/SBML-Kimlab/DISCODE"

[tool.setuptools.packages.find]
where = ["."]
include = ["discode*"]

[tool.setuptools.package-data]
discode = ["py.typed"]
